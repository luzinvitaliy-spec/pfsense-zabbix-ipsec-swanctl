zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 8c8feb3f6afd4095b07b69fbb412f20c
      name: GWs
  templates:
    - uuid: bd73c2a45e914f88b302c84b5d6e7f8a
      template: 'pfSense IPSec swanctl'
      name: 'pfSense IPSec swanctl'
      description: 'Новый шаблон для мониторинга IPSec туннелей на pfSense 2.9+ с использованием утилиты swanctl.'
      groups:
        - name: GWs
      discovery_rules:
        - uuid: 3db2f6c85e924148bd0d7b2a3c4b5004
          name: 'IPSec Tunnels Discovery'
          key: ipsec.discovery
          delay: '60'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: a1b2c3d4e5f6424aba9d0e1f2a3b4009
              name: 'IPSec: Tunnel {#TUNNEL_DESC} {#TUNNEL_NAME} Traffic In'
              key: 'ipsec.stats["{#TUNNEL_NAME}",bytes_in]'
              delay: '60'
              history: 30d
              trends: 90d
              units: Bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: Application
                  value: IPSec
            - uuid: b2c3d4e5f6a7474bad0e1f2a3b4c5010
              name: 'IPSec: Tunnel {#TUNNEL_DESC} {#TUNNEL_NAME} Traffic Out'
              key: 'ipsec.stats["{#TUNNEL_NAME}",bytes_out]'
              delay: '60'
              history: 30d
              trends: 90d
              units: Bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: Application
                  value: IPSec
            - uuid: c1b2a3f4e5d64c7bba90123456789005
              name: 'IPSec: Tunnel {#TUNNEL_DESC} {#TUNNEL_NAME} Raw Status'
              key: 'ipsec.stats["{#TUNNEL_NAME}",status]'
              delay: '60'
              history: 30d
              value_type: TEXT
              trends: '0'
              tags:
                - tag: Application
                  value: IPSec
            - uuid: d2c3b4a5f6e74d8cbb0123456789a006
              name: 'IPSec: Tunnel {#TUNNEL_DESC} {#TUNNEL_NAME} Status'
              type: DEPENDENT
              key: 'ipsec.status["{#TUNNEL_NAME}"]'
              delay: '0'
              history: 30d
              trends: 90d
              valuemap:
                name: 'IPSec status map'
              master_item:
                key: 'ipsec.stats["{#TUNNEL_NAME}",status]'
              tags:
                - tag: Application
                  value: IPSec
              trigger_prototypes:
                - uuid: 8d84a7b50c1a493e95a2f3e4d5c6b7a8
                  expression: 'last(/pfSense IPSec swanctl/ipsec.status["{#TUNNEL_NAME}"])=0'
                  name: 'IPSec: Tunnel {#TUNNEL_DESC} {#TUNNEL_NAME} is DOWN'
                  priority: DISASTER
                  manual_close: 'YES'
                  tags:
                    - tag: tunnel_name
                      value: '{#TUNNEL_NAME}'
                    - tag: tunnel_state
                      value: down
                - uuid: 3b94a7c52e1d483fa6b1e2f3d4c5b6a7
                  expression: 'last(/pfSense IPSec swanctl/ipsec.status["{#TUNNEL_NAME}"])=2'
                  name: 'IPSec: Tunnel {#TUNNEL_DESC} {#TUNNEL_NAME} Phase 2 missing'
                  priority: WARNING
                  manual_close: 'YES'
                  tags:
                    - tag: tunnel_name
                      value: '{#TUNNEL_NAME}'
          graph_prototypes:
            - uuid: 1c58203dbc8747bba90123a5cf6e7890
              name: 'IPSec: Tunnel {#TUNNEL_NAME} Status History'
              yaxismax: '2'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              graph_items:
                - drawtype: BOLD_LINE
                  color: 1A7C11
                  item:
                    host: 'pfSense IPSec swanctl'
                    key: 'ipsec.status["{#TUNNEL_NAME}"]'
            - uuid: a3f8c5b67d8e49a081c23d4e5f6a7b8c
              name: 'IPSec: Tunnel {#TUNNEL_NAME} Traffic Speed'
              graph_items:
                - color: F63100
                  item:
                    host: 'pfSense IPSec swanctl'
                    key: 'ipsec.stats["{#TUNNEL_NAME}",bytes_in]'
                - sortorder: '1'
                  color: 2774A4
                  item:
                    host: 'pfSense IPSec swanctl'
                    key: 'ipsec.stats["{#TUNNEL_NAME}",bytes_out]'
      valuemaps:
        - uuid: a571e9a3d34e48f8bd01c812c3f4e003
          name: 'IPSec status map'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
            - value: '2'
              newvalue: 'Phase 1 Only'
              
